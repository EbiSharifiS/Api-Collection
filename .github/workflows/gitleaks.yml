name: gitleaks

on:
  # Alarm: scan every push to every branch and tag. Runs after the push is
  # accepted, so it detects leaks (rotate the secret!) but cannot prevent them.
  push:
  # Gate: scan PRs targeting main. The "gitleaks" check is required by the
  # main ruleset, so a PR with a leak cannot be merged. Also covers PRs from forks.
  pull_request:
    branches: [main]
  # Manual run from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write # lets the action comment on the leaking line in a PR

jobs:
  scan:
    name: gitleaks # required status check name in the main ruleset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0 # full history, so every commit in the push/PR is scanned
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: 8.30.1 # keep in sync with rev in .pre-commit-config.yaml
          GITLEAKS_NOTIFY_USER_LIST: "@EbiSharifiS" # repo owner is emailed on any leak
