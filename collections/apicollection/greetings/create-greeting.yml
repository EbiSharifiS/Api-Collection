info:
  name: Create Greeting
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/greetings"
  headers:
    - name: X-API-KEY
      value: "{{apiKey}}"
  body:
    type: json
    data: |-
      {
        "message": "Hello, Bruno!"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("should echo message", function() {
          expect(res.status).to.equal(200);
          expect(res.body.message).to.equal("Hello, Bruno!");
        });

settings:
  encodeUrl: true
