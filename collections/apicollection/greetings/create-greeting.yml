info:
  name: Create Greeting
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/greetings"
  headers:
    - name: X-API-KEY
      value: "{{apiKey}}"
  body:
    type: json
    data: |-
      {
        "message": "Hello, Bruno!"
      }
  auth: inherit

settings:
  encodeUrl: true
