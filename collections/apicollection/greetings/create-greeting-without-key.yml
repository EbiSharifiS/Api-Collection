info:
  name: Create Greeting Without Key
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/greetings"
  body:
    type: json
    data: |-
      {
        "message": "Hello, Bruno!"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("should reject missing key", function() {
          expect(res.status).to.equal(401);
        });

settings:
  encodeUrl: true
